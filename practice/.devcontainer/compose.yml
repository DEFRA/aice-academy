# The practice environment: your service (app) plus a MongoDB database for Mission 8.
# app shares the database's network, so MongoDB is on localhost:27017 for you.
services:
  app:
    image: mcr.microsoft.com/devcontainers/base:bookworm
    command: sleep infinity
    volumes:
      - ../..:/workspaces:cached
    network_mode: service:mongodb
    depends_on:
      - mongodb

  mongodb:
    image: mongo:7.0.28
    restart: unless-stopped
    volumes:
      - mongodb-data:/data/db

volumes:
  mongodb-data:
