# The AI team, shown on the home page.
- name: product-coach
  job: Turns ideas and research into user stories, with tests in mind from the start.
- name: interaction-designer
  job: Maps the journey and designs each page with GOV.UK patterns.
- name: content-designer
  job: Makes every word clear, short and in GOV.UK style.
- name: developer
  job: Builds on Defra's CDP template to make the tests pass.
- name: tester
  job: Writes the tests before the code exists, then proves it works.
- name: accessibility-auditor
  job: Checks every page works for everyone.
- name: reviewer
  job: The critical friend. Checks quality, security and standards, and never edits.
