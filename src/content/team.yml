# The AI team, shown on the home page.
- name: Product coach
  job: Turns research into a to-do list, with a clear idea of when each thing is done.
- name: Interaction designer
  job: Plans every page using GOV.UK's tried-and-tested patterns.
- name: Content designer
  job: Makes every word clear, short and friendly.
- name: Developer
  job: Builds your pages until every test passes.
- name: Tester
  job: Writes checks before anything's built, then proves it works.
- name: Accessibility checker
  job: Makes sure every page works for everyone.
- name: Reviewer
  job: The critical friend. Checks quality and safety, and never changes anything.
